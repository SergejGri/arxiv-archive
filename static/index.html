<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arXiv-Archiv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ground:#e9edf0;
  --panel:#ffffff;
  --ink:#1a2230;
  --muted:#6b7785;
  --rule:#c9d2d9;
  --accent:#8c1515;
  --ok:#2f6b6e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px 64px}

header{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
  padding:28px 0 14px;border-bottom:2px solid var(--ink);
}
header h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.01em}
header .path{font-size:13px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--ok)}
.dot.down{background:var(--accent)}

.figures{
  display:grid;grid-template-columns:repeat(4,1fr);
  border-bottom:1px solid var(--rule);
}
.figure{padding:22px 20px 20px 0}
.figure .value{font-size:30px;font-weight:500;line-height:1.1;letter-spacing:-0.02em}
.figure .label{font-size:13px;color:var(--muted);margin-top:6px}

section{padding:28px 0;border-bottom:1px solid var(--rule)}
section h2{font-size:15px;font-weight:600;margin:0 0 14px}

table{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel)}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--rule)}
th{font-weight:500;color:var(--muted);border-bottom:1px solid var(--ink)}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
tr.unmapped td{color:var(--accent)}

.controls{
  display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;
  padding:16px;background:var(--panel);border:1px solid var(--rule);
}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted)}
select,input{
  font-family:inherit;font-size:14px;color:var(--ink);
  padding:6px 8px;background:#fff;
  border:1px solid var(--rule);border-radius:2px;min-width:140px;
}
input[type=date]{min-width:150px}
select:focus-visible,input:focus-visible,button:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px;
}
button{
  font-family:inherit;font-size:14px;padding:7px 16px;cursor:pointer;
  background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:2px;
}
button:hover{background:#2c3848}

.plot{
  position:relative;height:380px;margin-top:18px;padding:16px;
  background:var(--panel);border:1px solid var(--rule);
}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.note.error{color:var(--accent)}
pre.sql{
  margin:12px 0 0;padding:12px;overflow-x:auto;
  background:var(--panel);border-left:2px solid var(--rule);
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);
}
@media (max-width:760px){
  .figures{grid-template-columns:repeat(2,1fr)}
  .figure{padding-right:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>arXiv-Archiv</h1>
  <span class="status">
    <span class="dot" id="dot"></span>
    <span class="path mono" id="dbpath">verbinde…</span>
  </span>
</header>

<div class="figures" id="figures">
  <div class="figure"><div class="value mono" id="f-papers">—</div><div class="label">Paper im Archiv</div></div>
  <div class="figure"><div class="value mono" id="f-size">—</div><div class="label">Datenbankgröße</div></div>
  <div class="figure"><div class="value mono" id="f-range">—</div><div class="label">Einreichungszeitraum</div></div>
  <div class="figure"><div class="value mono" id="f-sync">—</div><div class="label">Letzte Aktualisierung</div></div>
</div>

<section>
  <h2>Paper je Hauptkategorie</h2>
  <table>
    <thead><tr>
      <th>Kategorie</th>
      <th class="num">Paper</th>
      <th class="num">Unterkategorien</th>
      <th class="num">Anteil</th>
    </tr></thead>
    <tbody id="cat-body"><tr><td colspan="4">Lade…</td></tr></tbody>
  </table>
  <p class="note" id="cat-note"></p>
</section>

<section style="border-bottom:none">
  <h2>Diagramm zusammenstellen</h2>
  <div class="controls">
    <div class="field"><label for="dimension">X-Achse</label>
      <select id="dimension"></select></div>
    <div class="field"><label for="measure">Kennzahl</label>
      <select id="measure"></select></div>
    <div class="field"><label for="series">Aufteilen nach</label>
      <select id="series"><option value="">keine Aufteilung</option></select></div>
    <div class="field"><label for="chartType">Darstellung</label>
      <select id="chartType"><option value="bar">Balken</option><option value="line">Linie</option></select></div>
    <div class="field"><label for="main_category">Hauptkategorie</label>
      <select id="main_category"><option value="">alle</option></select></div>
    <div class="field"><label for="author">Autor enthält</label>
      <input id="author" type="text" placeholder="z. B. Nadolsky"></div>
    <div class="field"><label for="date_from">Von</label>
      <input id="date_from" type="date"></div>
    <div class="field"><label for="date_to">Bis</label>
      <input id="date_to" type="date"></div>
    <div class="field"><label for="limit">Max. Gruppen</label>
      <select id="limit"><option>15</option><option selected>25</option><option>50</option><option>100</option></select></div>
    <button id="draw">Diagramm aktualisieren</button>
  </div>

  <div class="plot"><canvas id="chart"></canvas></div>
  <p class="note" id="chart-note"></p>
  <pre class="sql" id="sql"></pre>
</section>

</div>

<script>
const SERIES_COLORS = ["#8c1515","#2f6b6e","#b5822e","#3f5d8a","#6b7785","#7a4b8c","#4a7a3f"];
const $ = id => document.getElementById(id);

function humanBytes(n){
  if(!n) return "—";
  const u = ["B","KB","MB","GB","TB"];
  let i = 0;
  while(n >= 1024 && i < u.length-1){ n /= 1024; i++; }
  return n.toFixed(n < 10 && i > 0 ? 1 : 0) + " " + u[i];
}
const nf = new Intl.NumberFormat("de-DE");

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok){
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch(e){}
    throw new Error(detail);
  }
  return r.json();
}

async function loadStats(){
  try{
    const s = await getJSON("/api/stats");
    $("f-papers").textContent = nf.format(s.papers);
    $("f-size").textContent   = humanBytes(s.db_bytes);
    $("f-range").textContent  = s.earliest ? `${s.earliest.slice(0,4)}–${s.latest.slice(0,4)}` : "—";
    $("f-sync").textContent   = s.last_touched || "—";
    $("dbpath").textContent   = s.db_path;
    $("dot").className        = "dot live";
  }catch(e){
    $("dot").className = "dot down";
    $("dbpath").textContent = "kein Zugriff: " + e.message;
  }
}

async function loadCategories(){
  const body = $("cat-body");
  try{
    const rows = await getJSON("/api/categories");
    const total = rows.reduce((a,r)=>a+r.papers,0);
    body.innerHTML = "";
    for(const r of rows){
      const tr = document.createElement("tr");
      if(r.main_category === "unmapped") tr.className = "unmapped";
      tr.innerHTML = `<td>${r.main_category}</td>
        <td class="num">${nf.format(r.papers)}</td>
        <td class="num">${r.subcategories}</td>
        <td class="num">${(100*r.papers/total).toFixed(1)} %</td>`;
      body.appendChild(tr);
    }
    const un = rows.find(r=>r.main_category==="unmapped");
    $("cat-note").textContent = un
      ? `${nf.format(un.papers)} Paper tragen einen Code, den taxonomy.py nicht kennt.`
      : "Jeder Kategoriecode im Archiv ist in taxonomy.py abgebildet.";
    $("cat-note").className = un ? "note error" : "note";
  }catch(e){
    body.innerHTML = `<tr><td colspan="4">Kategorien nicht ladbar: ${e.message}</td></tr>`;
  }
}

async function loadSchema(){
  const s = await getJSON("/api/schema");
  const fill = (el, values, selected) => {
    for(const v of values){
      const o = document.createElement("option");
      o.value = v; o.textContent = v;
      if(v === selected) o.selected = true;
      el.appendChild(o);
    }
  };
  fill($("dimension"), s.dimensions, "year");
  fill($("measure"),   s.measures,   "papers");
  fill($("series"),    s.dimensions);
  fill($("main_category"), s.main_categories);
}

let chart = null;

function buildURL(){
  const p = new URLSearchParams({
    dimension: $("dimension").value,
    measure:   $("measure").value,
    limit:     $("limit").value
  });
  for(const k of ["series","main_category","author","date_from","date_to"]){
    if($(k).value) p.set(k, $(k).value);
  }
  return "/api/query?" + p.toString();
}

function toDatasets(rows, dim, measure, series){
  const labels = [...new Set(rows.map(r => String(r[dim])))].sort();
  if(!series){
    return { labels, datasets:[{
      label: measure,
      data: labels.map(l => {
        const hit = rows.find(r => String(r[dim]) === l);
        return hit ? hit[measure] : 0;
      }),
      backgroundColor: SERIES_COLORS[0],
      borderColor: SERIES_COLORS[0],
      borderWidth: 1.5
    }]};
  }
  const keys = [...new Set(rows.map(r => String(r[series])))].sort();
  return { labels, datasets: keys.map((k,i) => ({
    label: k,
    data: labels.map(l => {
      const hit = rows.find(r => String(r[dim]) === l && String(r[series]) === k);
      return hit ? hit[measure] : 0;
    }),
    backgroundColor: SERIES_COLORS[i % SERIES_COLORS.length],
    borderColor: SERIES_COLORS[i % SERIES_COLORS.length],
    borderWidth: 1.5
  }))};
}

async function draw(){
  const note = $("chart-note");
  note.className = "note";
  note.textContent = "Frage Datenbank ab…";
  try{
    const res  = await getJSON(buildURL());
    const rows = res.rows;
    $("sql").textContent = res.sql;

    if(!rows.length){
      note.textContent = "Keine Zeilen für diese Kombination. Filter lockern oder Zeitraum erweitern.";
      if(chart){ chart.destroy(); chart = null; }
      return;
    }

    const {labels, datasets} = toDatasets(rows, res.dimension, res.measure, res.series);
    if(chart) chart.destroy();
    chart = new Chart($("chart"), {
      type: $("chartType").value,
      data: {labels, datasets},
      options: {
        responsive:true, maintainAspectRatio:false,
        animation:{duration:200},
        plugins:{
          legend:{display: !!res.series, position:"bottom",
                  labels:{boxWidth:10, font:{family:"IBM Plex Sans", size:12}}}
        },
        scales:{
          x:{grid:{display:false},
             ticks:{font:{family:"IBM Plex Mono", size:11}, maxRotation:90, autoSkip:true}},
          y:{beginAtZero:true, grid:{color:"#e4e9ed"},
             ticks:{font:{family:"IBM Plex Mono", size:11}}}
        }
      }
    });
    note.textContent = `${rows.length} Zeilen, gruppiert nach ${res.dimension}.`;
  }catch(e){
    note.className = "note error";
    note.textContent = "Abfrage fehlgeschlagen: " + e.message;
    if(chart){ chart.destroy(); chart = null; }
  }
}

(async function init(){
  await Promise.all([loadStats(), loadCategories()]);
  await loadSchema();
  $("draw").addEventListener("click", draw);
  for(const id of ["dimension","measure","series","chartType","main_category","limit"]){
    $(id).addEventListener("change", draw);
  }
  for(const id of ["author","date_from","date_to"]){
    $(id).addEventListener("change", draw);
  }
  draw();
})();
</script>
</body>
</html>
